<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ART ZEDMO V9.1 PRO FIX</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#070f1c;color:#fff;padding:12px 12px 90px}.chip{border:1px solid #1e344d;padding:7px 14px;border-radius:20px;font-size:12px;cursor:pointer;display:inline-block;margin:3px;background:#0a1724;color:#fff}.on{background:#fff!important;color:#000!important;font-weight:800}.card{background:#111f2e;border:1px solid #1e344d;border-radius:18px;padding:14px;margin:12px 0}.tabs{display:flex;background:#070f1c;border-radius:20px;padding:3px}.tabs div{flex:1;text-align:center;padding:11px;border-radius:16px;font-weight:800;cursor:pointer}.inp{background:#070f1c;border:1px solid #1e344d;border-radius:12px;padding:12px;margin:6px 0;display:flex}.inp input,.inp select{flex:1;background:transparent;border:none;color:#fff;outline:none;font-weight:700;width:100%}.rate{background:#0a2318;color:#00ff9d;text-align:center;padding:10px;border-radius:10px;font-weight:800;margin:8px 0;font-size:13px}.line{display:flex;justify-content:space-between;font-size:13px;margin:5px 0;color:#9fb3c7}.btn{width:100%;background:#00ff9d;color:#000;border:none;padding:16px;border-radius:14px;font-weight:900;font-size:16px;margin-top:10px;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wbox{background:#0a1724;border:1px solid #1e344d;border-radius:12px;padding:10px;text-align:center;cursor:pointer}.wbox img{width:110px;height:110px;background:#fff;border-radius:8px}.view{display:none}.view.active{display:block}.nav{position:fixed;bottom:8px;left:8px;right:8px;background:#111f2e;border:1px solid #1e344d;border-radius:24px;display:flex;justify-content:space-around;padding:8px;z-index:90}.nav div{font-size:11px;padding:8px 4px;border-radius:16px;cursor:pointer;flex:1;text-align:center}.nav div.on{background:#fff;color:#000;font-weight:800}.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}.modal.active{display:flex}.modalBox{background:#111f2e;border:1px solid #1e344d;border-radius:18px;padding:18px;width:100%;max-width:380px;max-height:90vh;overflow:auto}</style></head><body>

<div id=authGate style="position:fixed;inset:0;background:#070f1c;z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px">
<div class=card style="width:100%;max-width:360px;text-align:center">
<b style="color:#00ff9d;font-size:22px">ART ZEDMO</b><p style="font-size:11px;color:#8aa1b6;margin:8px 0 12px">Inscription obligatoire</p>
<div class=tabs><div id=aLog class=on>Connexion</div><div id=aSign>Inscription</div></div>
<div id=authLogin style="margin-top:12px"><div class=inp><input id=lPhone type="tel" placeholder="Telephone +227..."></div><div class=inp><input id=lPass type="password" placeholder="Mot de passe"></div><button class=btn id=btnLogin>Se connecter</button></div>
<div id=authSignup style="display:none;margin-top:12px"><div class=inp><input id=sName type="text" placeholder="Nom complet"></div><div class=inp><input id=sPhone type="tel" placeholder="Telephone +227..."></div><div class=inp><input id=sPass type="password" placeholder="Creer mot de passe"></div><button class=btn id=btnSignup>Créer mon compte</button></div>
</div>
</div>

<div style="display:flex;justify-content:space-between;align-items:center"><b style="color:#00ff9d;font-size:20px">ART ZEDMO V9.1 PRO</b><div><span class=chip id=btnLogout style="border-color:#ff5555;color:#ff5555">Déconnexion</span></div></div>
<div class=card><div style="text-align:center"><div style="font-size:11px;color:#8aa1b6" id=soldeLabel>SOLDE PERSONNEL</div><h1 id=solde style="font-size:30px">0 FCFA</h1><p style="font-size:11px;color:#00ff9d;font-weight:700" id=userDisplay></p></div></div>

<div id=view-exchange class="view active">
<div class=card><div style="font-size:12px;color:#00ff9d;font-weight:800;margin-bottom:8px">Pays UEMOA</div><div id=countries></div><div style="margin-top:10px"><div id=operators></div></div></div>
<div class=card><div class=tabs><div id=tBuy class=on>Acheter</div><div id=tSell>Vendre</div></div>
<div id=buyZone><div class=inp><input id=payFCFA type="number" value="1000"></div><div class=inp><input id=phonePay placeholder="Numero payeur"></div><div class=inp><select id=cryptoRec><option>USDT_TRC20</option><option>BTC</option><option>ETH</option><option>BNB</option></select></div><div class=inp><input id=addrRec placeholder="Ton adresse crypto"></div></div>
<div id=sellZone style="display:none"><div class=inp><select id=cryptoSend><option>USDT_TRC20</option><option>BTC</option><option>ETH</option><option>BNB</option></select></div><div style="background:#070f1c;border:1px dashed #00ff9d;border-radius:12px;padding:10px;text-align:center;margin:8px 0"><b id=depAddr style="font-size:10px;word-break:break-all;color:#00ff9d"></b><br><img id=depQr style="width:140px;height:140px;background:#fff;padding:5px;border-radius:8px;margin-top:8px"></div><div class=inp><input id=amountCrypto type="number" value="10"></div><div class=inp><input id=phoneRec placeholder="Numero pour recevoir FCFA"></div></div>
<div class=rate id=rateBox></div><div class=line><span>Montant</span><span id=l1></span></div><div class=line><span>Frais 2%</span><span id=l2></span></div><div class=line style="color:#00ff9d;font-weight:900"><span>Total</span><span id=l3></span></div><button class=btn id=btnConfirm>Confirmer la transaction</button></div>
</div>

<div id=view-wallet class="view"><div class=card><b>Portefeuille</b><div id=wallet class=grid style="margin-top:10px"></div></div></div>
<div id=view-history class="view"><div class=card><b>Historique</b><div id=histList style="margin-top:10px"></div></div></div>
<div id=view-profile class="view"><div class=card><b>Profil</b><div class=line><span>Nom</span><span id=pName>-</span></div><div class=line><span>Tel</span><span id=pPhone>-</span></div></div></div>

<div class=nav><div id=n-ex class=on>Exchange</div><div id=n-wa>Portefeuille</div><div id=n-hi>Historique</div><div id=n-pr>Profil</div></div>

<div id=mod-wallet class=modal><div class=modalBox><div style="display:flex;justify-content:space-between"><b id=wTitle>BTC</b><span id=closeW>✕</span></div><div class=tabs style="margin:12px 0"><div id=wDep class=on>Dépôt</div><div id=wRet>Retrait</div></div><div id=wDepZone><b id=wAddr style="font-size:11px;word-break:break-all;color:#00ff9d"></b><div style="text-align:center;margin:12px 0"><img id=wQr style="width:160px;height:160px;background:#fff;padding:6px;border-radius:10px"></div><button class=btn id=btnCopy>Copy</button></div><div id=wRetZone style="display:none"><div class=inp><input id=wAmount type=number placeholder="0.001"></div><div class=inp><input id=wDest placeholder="Adresse"></div><div class=inp><select id=wNetwork><option>TRC20</option><option>ERC20</option><option>BTC</option><option>BEP20</option></select></div><button class=btn id=btnRetrait>Confirmer Retrait</button></div></div></div>
<div id=mod-success class=modal><div class=modalBox style="text-align:center"><b id=sTitle></b><div id=sMsg style="font-size:12px;color:#9fb3c7;text-align:left;background:#070f1c;padding:10px;border-radius:10px;white-space:pre-wrap;margin-top:8px"></div><button class=btn id=btnCloseSuccess>Voir Historique</button></div></div>

<script>
let TYPE='buy',CUR_COUNTRY='NE',CUR_OP='Airtel',CUR_W='BTC';
const COUNTRIES={BJ:{n:"Benin 🇧🇯",ops:["MTN","Moov","Celtiis"]},TG:{n:"Togo 🇹🇬",ops:["Togocel","Moov"]},CI:{n:"Cote d'Ivoire 🇨🇮",ops:["Orange","MTN","Wave"]},SN:{n:"Senegal 🇸🇳",ops:["Orange","Wave"]},BF:{n:"Burkina 🇧🇫",ops:["Orange","Moov"]},ML:{n:"Mali 🇲🇱",ops:["Orange","Moov"]},NE:{n:"Niger 🇳🇪",ops:["Airtel","Moov","Orange"]}};
const WALLET={BTC:"bc1q8u7tennfhstdpqrjtktnw4hdd6676vcwwdlfm4",ETH:"0xEa6529428464A958f2163944054B440599543a05",USDT_TRC20:"TFXZSyJaC6mdCva8kAJBMMvKYhyhpzpHn2",USDT_ERC20:"0xEa6529428464A958f2163944054B440599543a05",BNB:"0xEa6529428464A958f2163944054B440599543a05"};
let RATES={USDT_TRC20:605,USDT_ERC20:605,BTC:38500000,ETH:1850000,BNB:360000};
async function loadLiveRates(){try{const[bnb,btc,eth,fx]=await Promise.all([fetch('https://api.binance.com/api/v3/ticker/price?symbol=BNBUSDT').then(r=>r.json()).catch(()=>({price:788})),fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT').then(r=>r.json()).catch(()=>({price:87290})),fetch('https://api.binance.com/api/v3/ticker/price?symbol=ETHUSDT').then(r=>r.json()).catch(()=>({price:3200})),fetch('https://api.exchangerate-api.com/v4/latest/USD').then(r=>r.json()).catch(()=>({rates:{XOF:573.24}}))]);let xof=fx.rates.XOF||573.24;RATES.BNB=Math.round(parseFloat(bnb.price)*xof);RATES.BTC=Math.round(parseFloat(btc.price)*xof);RATES.ETH=Math.round(parseFloat(eth.price)*xof);RATES.USDT_TRC20=Math.round(xof);RATES.USDT_ERC20=Math.round(xof);if(TYPE=='buy')calcBuy();else calcSell();updateSoldeUI();}catch(e){}}
function getCurrentUser(){try{return JSON.parse(localStorage.getItem('zedmo_user'))}catch{return null}}
function getMyWallet(){let u=getCurrentUser();if(!u)return{FCFA:0};let k='wallet_'+u.phone;let w=localStorage.getItem(k);if(!w){w={BTC:0,ETH:0,BNB:0,USDT_TRC20:0,USDT_ERC20:0,FCFA:0};localStorage.setItem(k,JSON.stringify(w));}else w=JSON.parse(w);return w;}
function updateSoldeUI(){let w=getMyWallet();let u=getCurrentUser();if(!u)return;let total=w.FCFA + (w.BTC*RATES.BTC||0)+(w.ETH*RATES.ETH||0)+(w.BNB*RATES.BNB||0)+(w.USDT_TRC20*RATES.USDT_TRC20||0);document.getElementById('solde').innerText=Math.round(total).toLocaleString()+' FCFA';document.getElementById('userDisplay').innerText=u.name+' | '+u.phone;document.getElementById('pName').innerText=u.name;document.getElementById('pPhone').innerText=u.phone;if(u.phone.includes('196587303')){document.getElementById('soldeLabel').innerText='SOLDE TOTAL ADMIN';document.getElementById('soldeLabel').style.color='#ff9d00';}else{document.getElementById('soldeLabel').innerText='SOLDE PERSONNEL';}}
function setAuth(t){document.getElementById('aLog').className=t=='login'?'on':'';document.getElementById('aSign').className=t=='signup'?'on':'';document.getElementById('authLogin').style.display=t=='login'?'block':'none';document.getElementById('authSignup').style.display=t=='signup'?'block':'none';}
function checkAuth(){let u=localStorage.getItem('zedmo_user');if(u){document.getElementById('authGate').style.display='none';updateSoldeUI();}else{document.getElementById('authGate').style.display='flex';}}
function doSignup(){let n=document.getElementById('sName').value.trim(),p=document.getElementById('sPhone').value.trim(),pw=document.getElementById('sPass').value.trim();if(!n||!p||!pw)return alert('Remplis tout');localStorage.setItem('zedmo_user',JSON.stringify({name:n,phone:p,pass:pw}));let key='wallet_'+p;if(!localStorage.getItem(key))localStorage.setItem(key,JSON.stringify({BTC:0,ETH:0,BNB:0,USDT_TRC20:0,USDT_ERC20:0,FCFA:0}));alert('✅ Compte créé!');checkAuth();renderWallet();}
function doLogin(){let p=document.getElementById('lPhone').value.trim(),pw=document.getElementById('lPass').value.trim();let u=localStorage.getItem('zedmo_user');if(!u)return alert('Pas de compte, inscris-toi');let j=JSON.parse(u);if(j.phone===p&&j.pass===pw){checkAuth();renderWallet();}else alert('❌ Faux');}
function doLogout(){if(confirm('Deconnexion?')){localStorage.removeItem('zedmo_user');location.reload();}}
function switchView(v){document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));document.getElementById('view-'+v).classList.add('active');document.querySelectorAll('.nav div').forEach(e=>e.classList.remove('on'));let id='n-'+(v==='exchange'?'ex':v.slice(0,2));let el=document.getElementById(id);if(el)el.classList.add('on');if(v=='history')loadHist();if(v=='wallet')renderWallet();}
function setWType(t){document.getElementById('wDep').className=t=='dep'?'on':'';document.getElementById('wRet').className=t=='ret'?'on':'';document.getElementById('wDepZone').style.display=t=='dep'?'block':'none';document.getElementById('wRetZone').style.display=t=='ret'?'block':'none';}
function renderCountries(){let h='';for(let k in COUNTRIES){h+=`<span class="chip ${k==CUR_COUNTRY?'on':''}" data-c="${k}">${COUNTRIES[k].n}</span>`}document.getElementById('countries').innerHTML=h;document.querySelectorAll('#countries.chip').forEach(e=>e.addEventListener('click',()=>{CUR_COUNTRY=e.dataset.c;CUR_OP=COUNTRIES[CUR_COUNTRY].ops[0];renderCountries();calcBuy();calcSell();}));renderOps();}
function renderOps(){let h='';COUNTRIES[CUR_COUNTRY].ops.forEach(o=>{h+=`<span class="chip ${o==CUR_OP?'on':''}" data-o="${o}">${o}</span>`});document.getElementById('operators').innerHTML=h;document.querySelectorAll('#operators.chip').forEach(e=>e.addEventListener('click',()=>{CUR_OP=e.dataset.o;renderOps();}));}
function calcBuy(){let p=parseFloat(document.getElementById('payFCFA').value)||0;let cr=document.getElementById('cryptoRec').value;let rate=RATES[cr];let f=p*0.02;let tot=p+f;let rec=p/rate;document.getElementById('l1').innerText=p.toLocaleString()+' FCFA';document.getElementById('l2').innerText=f.toLocaleString()+' FCFA';document.getElementById('l3').innerText=tot.toLocaleString()+' FCFA';document.getElementById('rateBox').innerText=`LIVE: ${rec.toFixed(6)} ${cr} | 1 ${cr} = ${rate.toLocaleString()} FCFA`;}
function calcSell(){let a=parseFloat(document.getElementById('amountCrypto').value)||0;let cr=document.getElementById('cryptoSend').value;let rate=RATES[cr];let total=a*rate;let f=total*0.02;let net=total-f;document.getElementById('l1').innerText=a+' '+cr;document.getElementById('l2').innerText=f.toLocaleString()+' FCFA';document.getElementById('l3').innerText=net.toLocaleString()+' FCFA';document.getElementById('rateBox').innerText=`LIVE: ${net.toLocaleString()} FCFA`;}
function renderWallet(){let myW=getMyWallet();let h='';for(let k in WALLET){let qr=`https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${WALLET[k]}`;let bal=myW[k]||0;h+=`<div class=wbox data-w="${k}"><img src="${qr}"><br><b style="font-size:11px">${k}</b><p style="font-size:10px;color:#00ff9d;font-weight:800">${bal} ${k}</p></div>`;}document.getElementById('wallet').innerHTML=h;document.querySelectorAll('.wbox').forEach(e=>e.addEventListener('click',()=>openWallet(e.dataset.w)));}
function openWallet(k){CUR_W=k;document.getElementById('wTitle').innerText=k;document.getElementById('wAddr').innerText=WALLET[k];document.getElementById('wQr').src=`https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${WALLET[k]}`;document.getElementById('mod-wallet').classList.add('active');}
function closeM(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('active'));}
async function confirmer(){let btn=document.getElementById('btnConfirm');let old=btn.innerText;try{let data={};let u=getCurrentUser();if(TYPE=='buy'){let pay=document.getElementById('payFCFA').value,phone=document.getElementById('phonePay').value,crypto=document.getElementById('cryptoRec').value,addr=document.getElementById('addrRec').value;if(!pay||!phone||!addr)return alert('Remplis tout');data={type:'Mobile->Crypto',country:CUR_COUNTRY,operator:CUR_OP,amount:pay,phonePay:phone,crypto:crypto,address:addr,user:u};}else{let amount=document.getElementById('amountCrypto').value,crypto=document.getElementById('cryptoSend').value,phoneRec=document.getElementById('phoneRec').value;if(!amount||!phoneRec)return alert('Remplis');data={type:'Crypto->Mobile',country:CUR_COUNTRY,operator:CUR_OP,cryptoAmount:amount,crypto:crypto,depositTo:WALLET[crypto],phoneRec:phoneRec,user:u};}btn.innerText='⏳...';btn.disabled=true;let res=await fetch('/api/transaction',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let j=await res.json();document.getElementById('sTitle').innerText='OK';document.getElementById('sMsg').innerText=`ID: ${j.tx.id}\n${j.tx.status}`;document.getElementById('mod-success').classList.add('active');}catch(e){alert(e.message)}finally{btn.innerText=old;btn.disabled=false;}}
async function loadHist(){try{let r=await fetch('/api/admin/transactions');let d=await r.json();let u=getCurrentUser();let h='';d.slice(0,30).forEach(tx=>{if(u&&!u.phone.includes('196587303')&&tx.user&&tx.user.phone!==u.phone)return;h+=`<div style="border-bottom:1px solid #1e344d;padding:8px 0;font-size:12px"><b>${tx.type}</b> ${tx.crypto||''}<br><small>${tx.user?tx.user.phone:''}</small> - <span style="color:#00ff9d">${tx.status}</span></div>`});document.getElementById('histList').innerHTML=h||'Aucune';}catch(e){}}

document.getElementById('aLog').addEventListener('click',()=>setAuth('login'));
document.getElementById('aSign').addEventListener('click',()=>setAuth('signup'));
document.getElementById('btnLogin').addEventListener('click',doLogin);
document.getElementById('btnSignup').addEventListener('click',doSignup);
document.getElementById('btnLogout').addEventListener('click',doLogout);
document.getElementById('tBuy').addEventListener('click',()=>{TYPE='buy';document.getElementById('tBuy').className='on';document.getElementById('tSell').className='';document.getElementById('buyZone').style.display='block';document.getElementById('sellZone').style.display='none';calcBuy();});
document.getElementById('tSell').addEventListener('click',()=>{TYPE='sell';document.getElementById('tSell').className='on';document.getElementById('tBuy').className='';document.getElementById('sellZone').style.display='block';document.getElementById('buyZone').style.display='none';calcSell();});
document.getElementById('payFCFA').addEventListener('input',calcBuy);
document.getElementById('cryptoRec').addEventListener('change',calcBuy);
document.getElementById('cryptoSend').addEventListener('change',()=>{document.getElementById('depAddr').innerText=WALLET[document.getElementById('cryptoSend').value];document.getElementById('depQr').src=`https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${WALLET[document.getElementById('cryptoSend').value]}`;calcSell();});
document.getElementById('amountCrypto').addEventListener('input',calcSell);
document.getElementById('btnConfirm').addEventListener('click',confirmer);
document.getElementById('n-ex').addEventListener('click',()=>switchView('exchange'));
document.getElementById('n-wa').addEventListener('click',()=>switchView('wallet'));
document.getElementById('n-hi').addEventListener('click',()=>switchView('history'));
document.getElementById('n-pr').addEventListener('click',()=>switchView('profile'));
document.getElementById('closeW').addEventListener('click',closeM);
document.getElementById('wDep').addEventListener('click',()=>setWType('dep'));
document.getElementById('wRet').addEventListener('click',()=>setWType('ret'));
document.getElementById('btnCloseSuccess').addEventListener('click',()=>{closeM();switchView('history')});
document.getElementById('btnCopy').addEventListener('click',()=>{navigator.clipboard.writeText(document.getElementById('wAddr').innerText);alert('Copié')});
document.getElementById('mod-wallet').addEventListener('click',e=>{if(e.target.id==='mod-wallet')closeM()});
document.getElementById('mod-success').addEventListener('click',e=>{if(e.target.id==='mod-success')closeM()});

checkAuth();renderCountries();document.getElementById('depAddr').innerText=WALLET.USDT_TRC20;document.getElementById('depQr').src=`https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${WALLET.USDT_TRC20}`;calcBuy();renderWallet();loadLiveRates();setInterval(loadLiveRates,15000);
</script></body></html>
