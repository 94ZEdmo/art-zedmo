<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN V9.6 FIX BEP20 EMAIL</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#070d1a;color:#e6edf3;padding:10px}h1{color:#f5c518;font-size:18px}h2{color:#00ff9d;font-size:14px;margin:14px 0 6px}.topbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.badge{background:#111d2e;border:1px solid #1e3450;padding:8px 12px;border-radius:10px;font-size:13px}.btnTop{padding:8px 12px;border:none;border-radius:10px;font-weight:800;cursor:pointer}.tableWrap{overflow:auto;border-radius:12px;border:1px solid #1e3450;background:#0c1628;margin-bottom:12px}table{width:100%;border-collapse:collapse;min-width:950px;font-size:12px}th{background:#111d2e;color:#8ba0bf;padding:10px 6px;text-align:left}td{padding:8px 6px;border-top:1px solid #13223a;vertical-align:top}.addr{color:#00ff9d;font-size:10px;word-break:break-all;max-width:160px;display:block}.send{background:#f5c518;color:#000;padding:4px 8px;border-radius:8px;font-weight:900;display:inline-block;font-size:13px}.ok{color:#00ff9d}.act{color:#ff9d00}.btn{padding:6px 10px;border:none;border-radius:8px;font-weight:800;font-size:11px;cursor:pointer;width:75px;margin:2px 0;display:block}.btn-v{background:#00ff9d;color:#000}.btn-r{background:#ff3b3b;color:#fff}</style></head><body>
<h1>👑 ADMIN ART ZEDMO V9.6 - BEP20 + EMAIL FIX</h1>
<div class=topbar><div class=badge id=count>0 tx</div><div class=badge id=usersCount style="border-color:#00ff9d;color:#00ff9d">0 clients</div><div class=badge id=totalBusiness style="border-color:#f5c518;color:#f5c518">Volume: 0 FCFA</div><button class=btnTop onclick="load()" style="background:#1e3450;color:#fff">Actualiser</button><a href="/"><button class=btnTop style="background:#00d68f;color:#000">Retour App</button></a></div>
<h2>👥 CLIENTS INSCRITS (Tel + Email)</h2><div class=tableWrap><table><thead><tr><th>Nom</th><th>Telephone</th><th>Email</th><th>Nb Tx</th><th>Volume</th><th>Date Inscription</th></tr></thead><tbody id=tbodyUsers></tbody></table></div>
<h2>💸 TRANSACTIONS (TRC20 / BEP20)</h2><div class=tableWrap><table><thead><tr><th>ID</th><th>Type</th><th>Pays/Op</th><th>Montant Payé</th><th>À ENVOYER ➡️</th><th>Client + Adresse</th><th>Status</th><th>Action</th></tr></thead><tbody id=tbody></tbody></table></div>
<script>
let RATES_LIVE={USDT_TRC20:605,USDT_BEP20:605,USDT_ERC20:605,BTC:50000000,ETH:2000000,BNB:450000};
async function loadRates(){try{let fx=await fetch('https://api.exchangerate-api.com/v4/latest/USD').then(r=>r.json());let xof=fx.rates.XOF||605;RATES_LIVE.USDT_TRC20=Math.round(xof);RATES_LIVE.USDT_BEP20=Math.round(xof);RATES_LIVE.USDT_ERC20=Math.round(xof);let [bnb,btc,eth]=await Promise.all([fetch('https://api.binance.com/api/v3/ticker/price?symbol=BNBUSDT').then(r=>r.json()).catch(()=>({price:788})),fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT').then(r=>r.json()).catch(()=>({price:87000})),fetch('https://api.binance.com/api/v3/ticker/price?symbol=ETHUSDT').then(r=>r.json()).catch(()=>({price:3200}))]);RATES_LIVE.BNB=Math.round(parseFloat(bnb.price)*xof);RATES_LIVE.BTC=Math.round(parseFloat(btc.price)*xof);RATES_LIVE.ETH=Math.round(parseFloat(eth.price)*xof);}catch(e){}}
function formatToSend(tx){
  // FIX CRITIQUE: === et pas includes()
  if(tx.type === 'Mobile->Crypto'){
    let fcfa = parseFloat(tx.amount||0);
    let rate = RATES_LIVE[tx.crypto]||RATES_LIVE.USDT_TRC20;
    if(!rate) rate=605;
    let cryptoAmt = (fcfa / rate).toFixed(6);
    return `<span class=send>${cryptoAmt} ${tx.crypto}</span><br><small>${fcfa.toLocaleString()} FCFA → crypto</small>`;
  } else {
    let amount = parseFloat(tx.cryptoAmount||tx.amount||0);
    let rate = RATES_LIVE[tx.crypto]||RATES_LIVE.USDT_TRC20;
    if(!rate) rate=605;
    let fcfaNet = Math.round(amount*rate*0.98);
    return `<span class=send>${fcfaNet.toLocaleString()} FCFA</span><br><small>${amount} ${tx.crypto} LIVE -2%</small>`;
  }
}
async function load(){
  await loadRates();
  let rTx = await fetch('/api/admin/transactions');
  let data = await rTx.json();
  let usersDB = [];
  try{ let rU = await fetch('/api/admin/users'); usersDB = await rU.json(); }catch{ usersDB=[]; }
  let totalVol = data.reduce((s,tx)=> s + (parseFloat(tx.amount)||0), 0);
  document.getElementById('count').innerText = data.length+' tx | Attente: '+data.filter(t=>(t.status||'').toLowerCase().includes('attente')).length;
  document.getElementById('totalBusiness').innerText='Volume: '+Math.round(totalVol).toLocaleString()+' FCFA';
  let usersMap={};
  usersDB.forEach(u=>{ usersMap[u.phone]={name:u.name,phone:u.phone,email:u.email||'',date:u.date,count:0,vol:0} });
  data.forEach(tx=>{
    let phone = tx.user?.phone || tx.phonePay || tx.phoneRec || '';
    if(!phone) return;
    if(!usersMap[phone]) usersMap[phone]={name:tx.user?.name||'Client',phone:phone,email:tx.user?.email||'',date:'',count:0,vol:0};
    usersMap[phone].count++;
    usersMap[phone].vol+= parseFloat(tx.amount)||0;
  });
  let usersArr=Object.values(usersMap);
  document.getElementById('usersCount').innerText=usersArr.length+' clients';
  let hU=''; usersArr.reverse().forEach(u=>{
    hU+=`<tr><td><b>${u.name}</b></td><td style="color:#00ff9d">${u.phone}</td><td style="font-size:11px;color:#8ba0bf">${u.email||'-'}</td><td>${u.count} tx</td><td>${u.vol.toLocaleString()} FCFA</td><td><small>${u.date||''}</small></td></tr>`;
  });
  document.getElementById('tbodyUsers').innerHTML=hU||'<tr><td colspan=6>Aucun client - vérifie /api/admin/users</td></tr>';
  let tbody=''; data.slice().reverse().forEach(tx=>{
    let id=(tx.id+'').slice(-6); let isVal=(tx.status||'').includes('Valid'); let phone=tx.user?.phone||tx.phonePay||tx.phoneRec||''; let name=tx.user?.name||''; let email=tx.user?.email||'';
    tbody+=`<tr><td><b>${id}</b></td><td>${tx.type}<br><small style="color:#8ba0bf">${name}<br>${email}</small></td><td>${tx.country||''}/${tx.operator||''}</td><td><b>${tx.amount||tx.cryptoAmount} ${tx.crypto||'FCFA'}</b></td><td>${formatToSend(tx)}</td><td><b style="color:#00ff9d">${phone}</b><span class=addr>${tx.address||tx.depositTo||''}</span></td><td class="${isVal?'ok':'act'}">${tx.status}</td><td>${isVal?'<span class=ok>✅</span>':`<button class="btn btn-v" onclick="doVal('${tx.id}','Validé - Payé')">Valider</button><button class="btn btn-r" onclick="doVal('${tx.id}','Refusé')">Rejeter</button>`}</td></tr>`;
  });
  document.getElementById('tbody').innerHTML=tbody||'<tr><td colspan=8>Aucune transaction</td></tr>';
}
async function doVal(id,status){if(!confirm(status+' '+id+'?'))return;await fetch('/api/admin/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});load();}
load();setInterval(load,8000);
</script></body></html>
