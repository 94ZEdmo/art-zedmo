<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acheter USDT - ART ZEDMO v9.2</title>
<script src="crypto-prices-auto.js"></script>
<style>body{font-family:Arial;background:#0f0f0f;color:#fff;padding:20px}.box{background:#222;padding:20px;border-radius:15px;max-width:450px;margin:auto} input,select{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none} button{background:#00ff88;color:#000;padding:12px;width:100%;border-radius:8px;font-weight:bold;cursor:pointer}.prix{color:#00ff88;font-size:18px}.wallet{background:#111;padding:10px;border-radius:8px;margin:10px 0;border-left:3px solid #00ff88}</style>
</head>
<body>
<div class="box">
<h2>💰 Acheter USDT - ART ZEDMO</h2>
<div id="prix-live">Chargement prix auto...</div>

<label>Votre numéro MoMo (pour voir votre solde perso - Option 2)</label>
<input type="text" id="phone" placeholder="0196...">

<label>Réseau (Minimums que tu as fixé)</label>
<select id="network">
  <option value="BEP20">BEP20 - Min 5$ (~3100 FCFA) - Frais inclus</option>
  <option value="TRC20">TRC20 - Min 10$ (~6200 FCFA) - Frais inclus</option>
  <option value="ERC20">ERC20 - Min 20$ (~12400 FCFA) - Frais inclus</option>
</select>

<label>Montant en FCFA</label>
<input type="number" id="montant" placeholder="Ex: 5000">

<button onclick="calculer()">Calculer ce que vous recevez</button>

<div id="resultat" style="margin-top:15px;"></div>

<div id="zone-paiement" style="display:none;margin-top:15px;background:#111;padding:15px;border-radius:10px;">
  <b>Envoyez <span id="total-fcfa" style="color:#00ff88"></span> FCFA sur :</b><br><br>
  MTN: <b>0196587303</b><br>
  Moov: <b>0194655238</b><br>
  Nom: <b>TOUNKA ZAKARI Moussiliou</b><br><br>
  <small>Motif: votre numéro MoMo</small><br><br>
  <button onclick="confirmerCommande()" style="background:orange">J'ai envoyé, confirmer</button>
</div>

<div class="wallet">
  <b>Votre portefeuille (Option 2 - vous seul voyez)</b>
  <div id="mon-solde">Entrez votre numéro pour voir</div>
  <button onclick="voirMonSolde()" style="background:#333;color:#fff;margin-top:5px;">Actualiser mon solde</button>
</div>

</div>
<script>
let prixActuel = null;
let usdtCalcule = 0;
async function init(){ prixActuel = await getPrixZedmo(); document.getElementById('prix-live').innerHTML = `Taux: ${prixActuel.taux} FCFA | BEP20: <span class="prix">${prixActuel.BEP20}</span> | TRC20: <span class="prix">${prixActuel.TRC20}</span> | ERC20: <span class="prix">${prixActuel.ERC20}</span>`; } init();

async function calculer(){
  const reseau = document.getElementById('network').value;
  const montant = parseFloat(document.getElementById('montant').value);
  if(!montant) return alert('Entrez montant');
  const prixVente = prixActuel[reseau];
  const minDollar = ZEDMO_CRYPTO.minimums[reseau];
  const minFcfa = minDollar * prixActuel.taux;
  if(montant < minFcfa){ alert(`Minimum ${reseau} = ${minFcfa.toFixed(0)} FCFA (${minDollar}$)`); return; }
  usdtCalcule = (montant / prixVente).toFixed(2);
  document.getElementById('resultat').innerHTML = `Vous recevrez: <b style="color:#00ff88;font-size:22px">${usdtCalcule} USDT (${reseau})</b><br>Prix utilisé: ${prixVente} FCFA/USDT (frais inclus)`;
  document.getElementById('total-fcfa').innerText = montant;
  document.getElementById('zone-paiement').style.display = 'block';
}

async function confirmerCommande(){
  const phone = document.getElementById('phone').value;
  const montant = document.getElementById('montant').value;
  const reseau = document.getElementById('network').value;
  if(!phone) return alert('Entrez votre numéro');
  const data = { phonePay: phone, amountFCFA: montant, usdtAmount: usdtCalcule, network: reseau, type: 'BUY_CRYPTO', status: 'EN_ATTENTE', date: new Date().toISOString() };
  const res = await fetch('/api/transaction', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)});
  if(res.ok){ alert('Commande envoyée! Attendez validation admin.'); voirMonSolde(); }
}

async function voirMonSolde(){
  const phone = document.getElementById('phone').value;
  if(!phone) return alert('Entrez numéro');
  const res = await fetch(`/api/my-transactions?phone=${phone}`);
  const all = await res.json();
  let total = 0; all.forEach(t=>{ if(t.status==='VALIDE') total += parseFloat(t.usdtAmount||0); });
  document.getElementById('mon-solde').innerHTML = `Solde validé: <b style="color:#00ff88">${total} USDT</b><br>Transactions: ${all.length}`;
}
</script>
</body>
</html>
